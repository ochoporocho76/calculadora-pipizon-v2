<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>La Calculadora de Pipizon</title>
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pipizon">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <!-- Registro del Service Worker para PWABuilder -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker registrado con éxito'))
        .catch((error) => console.log('Error al registrar el Service Worker:', error));
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
    @keyframes pulse-red { 0%, 100% { background-color: rgba(239, 68, 68, 0.15); } 50% { background-color: rgba(239, 68, 68, 0.35); } }
    .bg-alert-red { animation: pulse-red 1.2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl relative overflow-x-hidden border-x border-slate-800">
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 pb-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-xl shadow-lg shadow-emerald-500/20">🧮</div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight text-white leading-none">La Calculadora de Pipizon</h1>
          <p class="text-[11px] font-medium text-emerald-400 mt-0.5">Control Inteligente de Gastos</p>
        </div>
      </div>
      <button onclick="shareToWsp()" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-slate-700/60 text-slate-300">
        <i data-lucide="share-2" class="w-4 h-4"></i>
      </button>
    </div>

    <div id="status-card" class="mt-3.5 p-3.5 rounded-2xl bg-slate-800/60 border border-slate-700/50">
      <div class="flex justify-between items-end mb-1.5">
        <div>
          <span class="text-[10px] font-bold uppercase text-slate-400">Total en Carrito</span>
          <div class="flex items-baseline gap-1">
            <span class="text-2xl font-extrabold text-white" id="total-amount">$0</span>
            <span class="text-xs text-slate-400 font-semibold" id="item-count-badge">(0 ítems)</span>
          </div>
        </div>
        <div class="text-right cursor-pointer" onclick="openBudgetModal()">
          <span class="text-[10px] font-bold uppercase text-slate-400 flex items-center justify-end gap-1">
            Tope Máximo <i data-lucide="edit-2" class="w-2.5 h-2.5"></i>
          </span>
          <span class="text-base font-bold text-slate-200" id="budget-amount">$50.000</span>
        </div>
      </div>

      <div class="w-full bg-slate-950/80 h-3 rounded-full overflow-hidden p-0.5 border border-slate-800">
        <div id="progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500 w-0"></div>
      </div>

      <div class="flex justify-between items-center mt-2 text-[11px] font-semibold">
        <span id="budget-percentage" class="text-emerald-400">0% consumido</span>
        <span id="budget-remaining" class="text-slate-300">Disponible: $50.000</span>
      </div>
    </div>
  </header>

  <nav class="flex border-b border-slate-800 bg-slate-900/40 text-xs font-bold text-slate-400">
    <button onclick="switchTab('cart')" id="tab-cart" class="flex-1 py-2.5 text-center border-b-2 border-emerald-500 text-emerald-400 flex items-center justify-center gap-1.5">
      <i data-lucide="shopping-cart" class="w-4 h-4"></i> Carrito
    </button>
    <button onclick="switchTab('planner')" id="tab-planner" class="flex-1 py-2.5 text-center border-b-2 border-transparent flex items-center justify-center gap-1.5">
      <i data-lucide="list-checks" class="w-4 h-4"></i> Lista Previa
    </button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2.5 text-center border-b-2 border-transparent flex items-center justify-center gap-1.5">
      <i data-lucide="history" class="w-4 h-4"></i> Historial
    </button>
  </nav>

  <main class="flex-1 p-4 pb-28 overflow-y-auto">
    <div id="view-cart" class="space-y-3">
      <div class="flex gap-2">
        <input type="text" id="quick-prod-name" placeholder="Producto (ej: Leche)" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
        <input type="number" id="quick-prod-price" placeholder="Precio ($)" class="w-28 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
        <button onclick="addQuickProduct()" class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold flex items-center justify-center">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
        <button onclick="triggerOcrScan()" class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold flex items-center justify-center" title="Escanear etiqueta">
          <i data-lucide="camera" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="empty-cart-msg" class="text-center py-10 text-slate-500">
        <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-slate-900 flex items-center justify-center text-slate-600 border border-slate-800">
          <i data-lucide="shopping-bag" class="w-7 h-7"></i>
        </div>
        <p class="text-sm font-semibold text-slate-400">El carrito está vacío</p>
      </div>

      <div id="cart-list" class="space-y-2"></div>
    </div>

    <div id="view-planner" class="hidden space-y-3">
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
        <div class="flex gap-2">
          <input type="text" id="plan-prod-name" placeholder="¿Qué querés comprar?" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          <input type="number" id="plan-prod-price" placeholder="Est. ($)" class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          <button onclick="addPlannedItem()" class="bg-slate-800 text-emerald-400 border border-emerald-500/30 px-3 rounded-xl font-bold text-xs">Añadir</button>
        </div>
      </div>
      <div id="planner-list" class="space-y-2"></div>
    </div>

    <div id="view-history" class="hidden space-y-3">
      <div id="history-comparison-card" class="hidden p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300"></div>
      <div id="history-list" class="space-y-3"></div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex gap-2 z-20">
    <button onclick="finishShopping()" class="flex-1 bg-emerald-500 text-slate-950 py-3 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2">
      <i data-lucide="check-circle" class="w-4 h-4"></i> Guardar Compra
    </button>
    <button onclick="clearCart()" class="bg-slate-800 text-slate-400 p-3 rounded-xl border border-slate-700/50">
      <i data-lucide="trash-2" class="w-5 h-5"></i>
    </button>
  </div>

  <div id="modal-budget" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-5">
      <h3 class="text-base font-bold text-white mb-2">Establecer Tope</h3>
      <input type="number" id="budget-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-lg font-bold text-emerald-400 text-center mb-3">
      <div class="flex gap-2">
        <button onclick="closeBudgetModal()" class="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold text-xs">Cancelar</button>
        <button onclick="saveBudget()" class="flex-1 bg-emerald-500 text-slate-950 py-2.5 rounded-xl font-extrabold text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <div id="modal-ocr" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-5 text-center">
      <p class="text-xs text-slate-400 mb-3">Escanear producto de ejemplo:</p>
      <div class="grid grid-cols-2 gap-2 mb-4">
        <button onclick="simulateOcrResult('Yerba Mate 1kg', 3450)" class="p-2 bg-slate-800 text-left rounded-lg text-xs">
          <span class="block text-white font-bold">Yerba 1kg</span>
          <span class="text-emerald-400">$3.450</span>
        </button>
        <button onclick="simulateOcrResult('Queso Cremoso', 4890)" class="p-2 bg-slate-800 text-left rounded-lg text-xs">
          <span class="block text-white font-bold">Queso Cremoso</span>
          <span class="text-emerald-400">$4.890</span>
        </button>
      </div>
      <button onclick="closeOcrModal()" class="w-full bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold text-xs">Cancelar</button>
    </div>
  </div>

  <script>
    let budget = 50000;
    let cart = [];
    let planner = [{ id: 1, name: 'Pan Lactal', price: 2100 }];
    let history = [];
    let alert90 = false, alert100 = false;

    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(type === 'danger' ? 800 : (type === 'warn' ? 440 : 587), ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(type === 'danger' ? [100,50,100] : 30);
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadData();
      render();
    });

    function loadData() {
      if (localStorage.getItem('pip_b')) budget = parseFloat(localStorage.getItem('pip_b'));
      if (localStorage.getItem('pip_c')) cart = JSON.parse(localStorage.getItem('pip_c'));
      if (localStorage.getItem('pip_p')) planner = JSON.parse(localStorage.getItem('pip_p'));
      if (localStorage.getItem('pip_h')) history = JSON.parse(localStorage.getItem('pip_h'));
    }

    function saveData() {
      localStorage.setItem('pip_b', budget);
      localStorage.setItem('pip_c', JSON.stringify(cart));
      localStorage.setItem('pip_p', JSON.stringify(planner));
      localStorage.setItem('pip_h', JSON.stringify(history));
    }

    function fmt(val) { return '$' + Math.round(val).toLocaleString('es-AR'); }

    function render() {
      const active = cart.filter(i => !i.crossed);
      const total = active.reduce((a, b) => a + b.price, 0);
      const pct = budget > 0 ? Math.min(Math.round((total / budget) * 100), 999) : 0;
      const rem = budget - total;

      document.getElementById('total-amount').innerText = fmt(total);
      document.getElementById('item-count-badge').innerText = `(${active.length} ítems)`;
      document.getElementById('budget-amount').innerText = fmt(budget);
      document.getElementById('progress-bar').style.width = Math.min(pct, 100) + '%';
      document.getElementById('budget-percentage').innerText = `${pct}% consumido`;
      document.getElementById('budget-remaining').innerText = rem >= 0 ? `Disponible: ${fmt(rem)}` : `Excedido: ${fmt(Math.abs(rem))}`;

      if (pct >= 100 && !alert100) { playBeep('danger'); alert100 = true; }
      if (pct >= 90 && pct < 100 && !alert90) { playBeep('warn'); alert90 = true; }
      if (pct < 90) { alert90 = false; alert100 = false; }

      renderCart(); renderPlanner(); renderHistory(); saveData();
    }

    function renderCart() {
      const container = document.getElementById('cart-list');
      document.getElementById('empty-cart-msg').classList.toggle('hidden', cart.length > 0);
      container.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between p-3 rounded-xl ${item.crossed ? 'bg-slate-900/40 opacity-50' : 'bg-slate-900'} border border-slate-800">
          <div class="flex items-center gap-3 flex-1" onclick="toggleCross(${item.id})">
            <span class="text-xs font-bold ${item.crossed ? 'line-through text-slate-500' : 'text-slate-100'}">${item.name}</span>
            <span class="text-xs font-extrabold ${item.crossed ? 'line-through text-slate-600' : 'text-emerald-400'}">${fmt(item.price)}</span>
          </div>
          <button onclick="removeItem(${item.id})" class="p-1 text-slate-600 hover:text-rose-400"><i data-lucide="trash" class="w-4 h-4"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function addQuickProduct() {
      const n = document.getElementById('quick-prod-name').value.trim() || 'Producto';
      const p = parseFloat(document.getElementById('quick-prod-price').value);
      if (p > 0) { cart.unshift({ id: Date.now(), name: n, price: p, crossed: false }); document.getElementById('quick-prod-name').value = ''; document.getElementById('quick-prod-price').value = ''; playBeep('add'); render(); }
    }

    function toggleCross(id) { cart = cart.map(i => i.id === id ? { ...i, crossed: !i.crossed } : i); render(); }
    function removeItem(id) { cart = cart.filter(i => i.id !== id); render(); }
    function clearCart() { if (confirm('¿Vaciar carrito?')) { cart = []; render(); } }

    function renderPlanner() {
      document.getElementById('planner-list').innerHTML = planner.map(i => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs">
          <div><span class="font-bold text-white block">${i.name}</span><span class="text-slate-400">${fmt(i.price)}</span></div>
          <button onclick="moveToCart(${i.id})" class="px-2 py-1 bg-emerald-500/20 text-emerald-400 rounded-lg font-bold">+ Carrito</button>
        </div>
      `).join('');
    }

    function addPlannedItem() {
      const n = document.getElementById('plan-prod-name').value.trim();
      const p = parseFloat(document.getElementById('plan-prod-price').value) || 0;
      if (n) { planner.push({ id: Date.now(), name: n, price: p }); document.getElementById('plan-prod-name').value = ''; render(); }
    }

    function moveToCart(id) {
      const i = planner.find(p => p.id === id);
      if (i) { cart.unshift({ id: Date.now(), name: i.name, price: i.price, crossed: false }); planner = planner.filter(p => p.id !== id); playBeep('add'); render(); }
    }

    function finishShopping() {
      const active = cart.filter(i => !i.crossed);
      if (active.length === 0) return;
      history.unshift({ id: Date.now(), date: new Date().toLocaleDateString(), total: active.reduce((a,b)=>a+b.price,0), itemsCount: active.length, items: active });
      cart = []; render(); switchTab('history');
    }

    function renderHistory() {
      document.getElementById('history-list').innerHTML = history.map(h => `
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
          <div class="flex justify-between font-bold text-white mb-1"><span>${h.date}</span><span class="text-emerald-400">${fmt(h.total)}</span></div>
          <p class="text-slate-500">${h.itemsCount} productos</p>
        </div>
      `).join('');
    }

    function openBudgetModal() { document.getElementById('modal-budget').classList.remove('hidden'); }
    function closeBudgetModal() { document.getElementById('modal-budget').classList.add('hidden'); }
    function saveBudget() { budget = parseFloat(document.getElementById('budget-input').value) || budget; closeBudgetModal(); render(); }
    function triggerOcrScan() { document.getElementById('modal-ocr').classList.remove('hidden'); }
    function closeOcrModal() { document.getElementById('modal-ocr').classList.add('hidden'); }
    function simulateOcrResult(n, p) { cart.unshift({ id: Date.now(), name: n, price: p, crossed: false }); playBeep('add'); closeOcrModal(); render(); }

    function shareToWsp() {
      const active = cart.filter(i => !i.crossed);
      const total = active.reduce((a, b) => a + b.price, 0);
      let text = `🛒 *La Calculadora de Pipizon*\nTotal: ${fmt(total)} / Tope: ${fmt(budget)}\n`;
      active.forEach(i => text += `• ${i.name}: ${fmt(i.price)}\n`);
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function switchTab(t) {
      ['cart', 'planner', 'history'].forEach(x => {
        document.getElementById(`view-${x}`).classList.toggle('hidden', x !== t);
      });
    }
  </script>
</body>
</html>
